{{define "monthly_category_row.html"}}
{{$i := .Index}}{{$r := .Row}}{{$f := .Filter}}
<tr class="cat-row">
  <td>{{$r.Category}}</td>
  <td class="num">{{$r.Count}}</td>
  <td class="amount">{{formatMoney $r.Fixed}}</td>
  <td class="amount">{{formatMoney $r.Variable}}</td>
  <td class="amount">{{formatMoney $r.Installment}}</td>
  <td class="amount strong">{{formatMoney $r.Total}}</td>
  <td class="num">{{printf "%.1f" $r.Pct}}%</td>
  <td>
    <button id="cat-btn-{{$i}}" class="btn btn-sm"
            hx-get="/reports/monthly/detail?period={{$f.Period}}&category={{urlPathEscape $r.Category}}&{{cardsQuery $f.Cards}}&expense_type={{$f.ExpenseType}}"
            hx-target="#detail-{{$i}}"
            hx-swap="innerHTML"
            hx-indicator="#detail-{{$i}}"
            hx-on::before-request="var d=document.getElementById('detail-'+this.id.slice(8));if(d&&d.querySelector('.detail-cell')){d.innerHTML='<td colspan=8></td>';this.textContent='▶';event.preventDefault();}"
            hx-on::after-request="var d=document.getElementById('detail-'+this.id.slice(8));this.textContent=(d&&d.querySelector('.detail-cell'))?'▼':'▶';">▶</button>
  </td>
</tr>
<tr id="detail-{{$i}}" class="detail-row"><td colspan="8"></td></tr>
{{end}}
